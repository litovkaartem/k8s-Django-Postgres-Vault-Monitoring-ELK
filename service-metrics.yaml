apiVersion: v1
kind: Service
metadata:
  name: django-metrics
  namespace: django-app
  labels:
    app: django-app
    monitoring: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/metrics"
spec:
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: metrics
  selector:
    app: django-app
